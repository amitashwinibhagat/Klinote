name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # No model, no network, no audio device required.
      - name: Test
        run: cargo test --workspace

      - name: No networking dependencies
        run: |
          if cargo tree --workspace | grep -Ei 'reqwest|hyper|ureq|isahc|surf|attohttpc|curl'; then
            echo "::error::A networking crate entered the dependency graph. See ADR 0002."
            exit 1
          fi
          echo "dependency graph is network-free"
