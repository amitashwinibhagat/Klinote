[package]
name = "scribe-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "C ABI for the Local Clinical Scribe engine, consumed by the Swift shell."

[lib]
name = "scribe_core_ffi"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
scribe-core.workspace = true
scribe-note.workspace = true
scribe-pipeline.workspace = true
scribe-store.workspace = true
# The energy VAD only. The shell recognises the speech; it sends the recording
# back here purely so the engine can measure where the silences are, because the
# system recogniser's ranges are contiguous and the two voices are otherwise
# indistinguishable.
scribe-audio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true

# No speech engine, deliberately. Recognition is the shell's job on macOS
# (`SpeechAnalyzer` is a Swift API), so nothing here can reach whisper.cpp — and
# a clinical app bundle should not contain a large C++ model parser it never
# calls. The old `scribe-asr-whisper` dependency put whisper.cpp into the app
# through this crate; `scribe-cli` still pulls it in for the concierge tool.

[dev-dependencies]
hound = "3"
