# SOAP — general practice
# The default template. Cues drive rule-based routing of transcript sentences.
id = "soap"
name = "SOAP Note"
discipline = "general_practice"
version = "1"
description = "Subjective / Objective / Assessment / Plan. General practice default."

[[sections]]
