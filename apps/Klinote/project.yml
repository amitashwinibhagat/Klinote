name: Klinote
options:
  bundleIdPrefix: one.klinote
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.3"
    CURRENT_PROJECT_VERSION: "4"
    ALWAYS_SEARCH_USER_PATHS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Apple Silicon only, stated rather than assumed.
    #
    # The Rust engine is compiled by cargo for the host, so a build that also
    # targets x86_64 fails to link libscribe_core_ffi.a. This is an Apple
    # Silicon product — Metal, on-device models — and a genuinely universal
    # build would need a second cargo target, which is not something to fake
    # by leaving the arch list open.
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES

schemes:
  Klinote:
    build:
      targets:
        Klinote: all
        KlinoteTests: [test]
    run:
      config: Release
    test:
      config: Debug
      targets:
        - KlinoteTests
    archive:
      config: Release

targets:
  Klinote:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "Info.plist"
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: Klinote
        PRODUCT_BUNDLE_IDENTIFIER: one.klinote.mac
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Klinote.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Core/Klinote-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../../crates/scribe-ffi/include"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/../../target/klinote-link"
        OTHER_LDFLAGS:
          - "-lscribe_core_ffi"
          - "-lc++"
          - "-framework Accelerate"
          - "-framework Metal"
          - "-framework MetalKit"
          - "-framework Foundation"
        SWIFT_STRICT_CONCURRENCY: minimal
    preBuildScripts:
      - name: Build Rust core
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          cd "$SRCROOT/../.."
          cargo build --release -p scribe-ffi
          cargo build --release -p scribe-llm
          # Link the static library, never the dylib: cargo emits both, and the
          # linker prefers the dylib, which would leave the app bundle pointing
          # at an absolute path in target/ and unable to run anywhere else.
          mkdir -p target/klinote-link
          cp target/release/libscribe_core_ffi.a target/klinote-link/
    postBuildScripts:
      - name: Embed scribe-llm
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          helper="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/scribe-llm"
          cp "$SRCROOT/../../target/release/scribe-llm" "$helper"
          chmod +x "$helper"

          # cargo links the helper ad-hoc and a file copied by a script phase is
          # never signed by Xcode — the app gets sealed *around* it. The bundle
          # verifies locally, and notarization rejects the whole archive:
          #   "The binary is not signed with a valid Developer ID certificate."
          #   "The signature does not include a secure timestamp."
          #   "The executable does not have the hardened runtime enabled."
          # So sign it here, with the identity this build is using, before Xcode
          # seals the app.
          if [ "${CODE_SIGNING_ALLOWED:-NO}" = "YES" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            identity="$EXPANDED_CODE_SIGN_IDENTITY"
            case "$identity" in
              "Developer ID"*)
                # A secure timestamp needs Apple's servers, and only a real
                # certificate can carry one.
                codesign --force --options runtime --timestamp --sign "$identity" "$helper"
                ;;
              *)
                codesign --force --options runtime --sign "$identity" "$helper"
                ;;
            esac
          fi

  # Tests compile Sources/Domain directly instead of importing the app.
  #
  # @testable import of an application needs a test host, which means the app
  # launches during the test run — and launching it opens the encrypted store
  # and reads the Keychain. Tests that can raise a password prompt are not
  # tests. Domain has no FFI and no UI, so the bundle runs headless.
  KlinoteTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests
      - path: Sources/Domain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: one.klinote.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
