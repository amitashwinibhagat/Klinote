[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

# The SSR handler is emitted by @netlify/vite-plugin as a function; the plugin
# wires the redirect itself. This file is intentionally not setting a custom
# functions directory or framework plugin — the Vite plugin handles both.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The correct MIME type matters: browsers may ignore a manifest served as
# octet-stream, and it costs nothing to be right.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# The page has no forms that need device permissions and no reason to leak a
# referrer to the image host. HSTS and nosniff are Netlify defaults.
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
